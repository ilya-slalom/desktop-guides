name: Windows

on:
  # PR branches run through pull_request; push covers main after a merge.
  # Docs-only changes don't run CI; main has no required checks.
  push:
    branches: [main]
    paths-ignore: &docs-only ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:
    inputs:
      verify-test-gate:
        description: Inject one failing Core test to verify CI stops packaging
        type: boolean
        default: false
      shell-scope:
        description: Installed production-shell scenario group to run
        type: choice
        default: all
        options:
          - all
          - core
          - design
          - catalog
          - txt
          - html
          - pdf
          - progress
          - completion
          - theme
          - text-size
          - import
          - game-actions
          - provider
          - backup
      shell-pass:
        description: >-
          With shell-scope pdf only, comma-separated wildcards naming the PDF
          passes to run, for example pdf-zoom-*,pdf-locked-light. Empty runs
          every pass.
        type: string
        default: ''
      dev-fast:
        description: >-
          Run only the x64 production shell smoke, building it alongside
          core-tests. Ignored when verify-test-gate is set.
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a PR cancels its older run. Dispatches and main pushes each get
# their own group, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Record environment
        shell: pwsh
        run: |
          Write-Output "Image: $env:ImageOS $env:ImageVersion"
          dotnet --info
      - name: Generate fixtures
        shell: pwsh
        run: |
          python tools/p0/make_fixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/p0/verify_fixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- tests/fixtures/p0
          exit $LASTEXITCODE
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-headless-tests-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-headless-tests-
      - name: Restore locked headless test dependencies
        shell: pwsh
        run: |
          dotnet restore tests/DesktopGuides.Core.Tests/DesktopGuides.Core.Tests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/DesktopGuides.Infrastructure.Tests/DesktopGuides.Infrastructure.Tests.csproj --locked-mode
          exit $LASTEXITCODE
      - name: Inject deliberate failing Core test
        if: ${{ inputs.verify-test-gate }}
        shell: pwsh
        run: |
          @'
          using Xunit;
          namespace DesktopGuides.Core.Tests;
          public sealed class DeliberateCiGateTest {
              [Fact] public void FailsToVerifyTheGate() => Assert.Fail("Deliberate CI gate test");
          }
          '@ | Set-Content tests/DesktopGuides.Core.Tests/DeliberateCiGateTest.cs
      - name: Run core tests
        shell: pwsh
        run: |
          dotnet test tests/DesktopGuides.Core.Tests/DesktopGuides.Core.Tests.csproj `
            -c Release --no-restore `
            --logger "trx;LogFileName=core-tests.trx" `
            --results-directory artifacts/test-results
          exit $LASTEXITCODE
      - name: Run infrastructure tests
        shell: pwsh
        run: |
          dotnet test tests/DesktopGuides.Infrastructure.Tests/DesktopGuides.Infrastructure.Tests.csproj `
            -c Release --no-restore `
            --logger "trx;LogFileName=infrastructure-tests.trx" `
            --results-directory artifacts/test-results
          exit $LASTEXITCODE
      - name: Check public signing identity guard
        shell: pwsh
        run: ./tools/p1/test_sign_production_package.ps1
      - name: Check installed-shell process cleanup
        shell: pwsh
        run: ./tools/p1/test_windows_shell_process.ps1
      - name: Check fresh Preview profile guard
        shell: pwsh
        run: ./tools/p1/test_windows_shell_profile.ps1
      - name: Check installed-shell smoke result identity
        shell: pwsh
        run: ./tools/p1/test_windows_shell_smoke_result.ps1
      - name: Check screenshot statistics
        shell: pwsh
        run: ./tools/p1/test_windows_shell_screenshot_stats.ps1
      - name: Check app theme preference restore
        shell: pwsh
        run: ./tools/p1/test_windows_shell_theme_preference.ps1
      - name: Check toolbar smoke result identity
        shell: pwsh
        run: ./tools/p1/test_windows_reader_toolbar_smoke_result.ps1
      - name: Check toolbar install receipt ownership
        shell: pwsh
        run: ./tools/p1/test_windows_reader_toolbar_install_receipt.ps1
      - name: Check test-owned scheduled task cleanup
        shell: pwsh
        run: ./tools/p1/test_windows_shell_task_cleanup.ps1
      - name: Check portable release packaging
        shell: pwsh
        run: ./tools/p1/test_package_portable_release.ps1
      - name: Check provider credential parsing
        shell: pwsh
        run: ./tools/p1/test_windows_provider_credentials.ps1
      - name: Check loopback canary
        shell: pwsh
        run: python -m unittest discover -s tools/p0 -p "test_*.py" -v
      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn

  packages:
    needs: core-tests
    if: ${{ !(inputs.dev-fast && !inputs.verify-test-gate) }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Generate fixtures
        shell: pwsh
        run: |
          python tools/p0/make_fixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/p0/verify_fixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- tests/fixtures/p0
          exit $LASTEXITCODE
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-app-${{ matrix.architecture }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-app-${{ matrix.architecture }}-
      - name: Restore locked dependencies
        run: dotnet restore src/DesktopGuides.App/DesktopGuides.App.csproj --locked-mode -p:Platform=${{ matrix.architecture }}
      - name: Build unsigned package
        shell: pwsh
        run: |
          dotnet build src/DesktopGuides.App/DesktopGuides.App.csproj `
            -c Release --no-restore `
            -p:Platform=${{ matrix.architecture }} `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record build manifest
        shell: pwsh
        run: |
          $packages = @(
            Get-ChildItem src/DesktopGuides.App/AppPackages -Recurse -Filter 'DesktopGuides.App_*.msix' |
              Where-Object { $_.BaseName.EndsWith('_${{ matrix.architecture }}', [StringComparison]::OrdinalIgnoreCase) }
          )
          if ($packages.Count -ne 1) {
            throw "Expected one ${{ matrix.architecture }} app MSIX, found $($packages.Count)."
          }
          $package = $packages[0]
          if ($package.BaseName -notmatch '^DesktopGuides\.App_(?<Version>[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)_(x64|arm64)$') {
            throw "Unexpected app package name: $($package.Name)"
          }
          $packageVersion = $Matches.Version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = if (Test-Path $vswhere) {
            (& $vswhere -latest -products '*' -property installationVersion)
          } else { 'unavailable' }
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $windowsSdkBins = if (Test-Path $sdkRoot) {
            @(Get-ChildItem $sdkRoot -Directory | Select-Object -ExpandProperty Name)
          } else { @() }
          New-Item -ItemType Directory -Force artifacts/build | Out-Null
          [ordered]@{
            commit = $env:GITHUB_SHA
            architecture = '${{ matrix.architecture }}'
            runnerImage = "$env:ImageOS $env:ImageVersion"
            osBuild = [System.Environment]::OSVersion.Version.ToString()
            dotnetSdk = (dotnet --version)
            visualStudio = $visualStudio
            windowsSdkBins = $windowsSdkBins
            package = $package.Name
            packageVersion = $packageVersion
            packageBytes = $package.Length
            packageSha256 = (Get-FileHash $package.FullName -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content artifacts/build/manifest.json -Encoding utf8
          Copy-Item $package.FullName artifacts/build/
      - name: Upload package and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-guides-${{ matrix.architecture }}
          path: artifacts/build/*
          if-no-files-found: error

  production-packages:
    needs: core-tests
    if: ${{ !(inputs.dev-fast && !inputs.verify-test-gate) }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]
    steps: &production-packages-steps
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-production-${{ matrix.architecture }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-production-${{ matrix.architecture }}-
      - name: Restore locked production dependencies
        run: dotnet restore src/DesktopGuides.Production/DesktopGuides.Production.csproj --locked-mode -p:Platform=${{ matrix.architecture }}
      - name: Build unsigned production package
        shell: pwsh
        run: |
          dotnet build src/DesktopGuides.Production/DesktopGuides.Production.csproj `
            -c Release --no-restore `
            -p:Platform=${{ matrix.architecture }} `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem src/DesktopGuides.Production/AppPackages -Recurse `
            -Filter 'DesktopGuides.Production_*.msix' |
            Where-Object {
              $_.BaseName.EndsWith('_${{ matrix.architecture }}',
                [StringComparison]::OrdinalIgnoreCase)
            })
          if ($packages.Count -ne 1) {
            throw "Expected one ${{ matrix.architecture }} production MSIX, found $($packages.Count)."
          }
          $identityJson = python tools/p1/verify_production_package.py $packages[0].FullName `
            --name DesktopGuides.Preview `
            --publisher 'CN=DesktopGuides Development' `
            --version 0.1.0.0 `
            --architecture '${{ matrix.architecture }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packageIdentity = $identityJson | ConvertFrom-Json
          New-Item -ItemType Directory -Force artifacts/production-build | Out-Null
          [ordered]@{
            commit = $env:GITHUB_SHA
            architecture = '${{ matrix.architecture }}'
            identityName = $packageIdentity.name
            publisher = $packageIdentity.publisher
            packageVersion = $packageIdentity.version
            windowsAppRuntimeMinimum = $packageIdentity.windowsAppRuntimeMinimum
            runnerImage = "$env:ImageOS $env:ImageVersion"
            osBuild = [System.Environment]::OSVersion.Version.ToString()
            dotnetSdk = (dotnet --version)
            package = $packages[0].Name
            packageBytes = $packages[0].Length
            packageSha256 = (Get-FileHash $packages[0].FullName -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content artifacts/production-build/manifest.json -Encoding utf8
          Copy-Item $packages[0].FullName artifacts/production-build/
      - name: Build and verify the public lane
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          # T17.1: the released identity must pack and verify on every build.
          # Its own output folder keeps it apart from the Preview package.
          dotnet build src/DesktopGuides.Production/DesktopGuides.Production.csproj `
            -c Release --no-restore `
            -p:Platform=x64 `
            -p:PackageLane=Public `
            -p:AppxPackageDir=$PWD/artifacts/public-lane/ `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem artifacts/public-lane -Recurse `
            -Filter 'DesktopGuides.Production_*_x64.msix')
          if ($packages.Count -ne 1) {
            throw "Expected one public x64 MSIX, found $($packages.Count)."
          }
          python tools/p1/verify_production_package.py $packages[0].FullName `
            --name IlyaLissoboi.DesktopGuides `
            --publisher 'CN=359962D5-3801-484E-BE5B-39D0D498BEA4' `
            --version 1.0.0.0 `
            --architecture x64
          exit $LASTEXITCODE
      - name: Upload production package and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-guides-production-${{ matrix.architecture }}
          path: artifacts/production-build/*
          if-no-files-found: error

  production-shell-ui:
    name: production-shell-ui (${{ matrix.shard }})
    needs: production-packages
    runs-on: windows-2025
    strategy: &production-shell-ui-strategy
      fail-fast: false
      matrix:
        # Scenario groups are independent, so they shard across runners of
        # about six minutes each. A dispatch with one shell-scope runs only
        # that group.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.shell-scope != 'all' && format('[{{"shard":"{0}","groups":"{0}"}}]', inputs.shell-scope) || '[{"shard":"core","groups":"core,txt,game-actions"},{"shard":"design","groups":"design,catalog,completion,backup"},{"shard":"pdf","groups":"pdf,progress,theme,text-size"},{"shard":"html","groups":"html,import,provider"}]') }}
    steps: &production-shell-ui-steps
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.401
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-guides-production-x64
          path: artifacts/production-shell/download
      - name: Verify interactive desktop and package
        shell: pwsh
        run: |
          $session = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          $explorer = @(Get-Process explorer -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -eq $session })
          if ($explorer.Count -eq 0) { throw 'No interactive desktop in the runner session.' }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Signing test requires an elevated runner account.'
          }
          $packages = @(Get-ChildItem artifacts/production-shell/download `
            -Filter 'DesktopGuides.Production_*_x64.msix')
          if ($packages.Count -ne 1) { throw 'Expected one x64 production package.' }
          $manifest = Get-Content artifacts/production-shell/download/manifest.json -Raw |
            ConvertFrom-Json
          if ($manifest.architecture -ne 'x64' -or
              $manifest.identityName -ne 'DesktopGuides.Preview' -or
              $manifest.publisher -ne 'CN=DesktopGuides Development' -or
              $manifest.packageVersion -ne '0.1.0.0' -or
              $manifest.windowsAppRuntimeMinimum -ne '2.5.1.0' -or
              $manifest.package -ne $packages[0].Name -or
              $manifest.packageSha256 -ne
                (Get-FileHash $packages[0].FullName -Algorithm SHA256).Hash) {
            throw 'Production package does not match its build manifest.'
          }
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-shell-seed-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-shell-seed-
      - name: Restore locked shell seed dependencies
        run: dotnet restore tools/p1/DesktopGuides.ShellSeed/DesktopGuides.ShellSeed.csproj --locked-mode
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Generate fixtures
        shell: pwsh
        run: |
          python tools/p0/make_fixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/p0/verify_fixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign, install, and test production shell
        shell: pwsh
        env:
          SHELL_GROUPS: ${{ matrix.groups }}
          # push and pull_request always run every pass.
          SHELL_PASS: ${{ github.event_name == 'workflow_dispatch' && inputs.shell-pass || '' }}
        run: |
          $package = Get-ChildItem artifacts/production-shell/download `
            -Filter 'DesktopGuides.Production_*_x64.msix' |
            Select-Object -First 1
          $filter = @{}
          if ($env:SHELL_PASS) {
            $filter.PassFilter = @($env:SHELL_PASS -split ',' | ForEach-Object { $_.Trim() })
          }
          Write-Output "Scenario groups: $env:SHELL_GROUPS; passes: $(if ($env:SHELL_PASS) { $env:SHELL_PASS } else { 'all' })"
          & ./tools/p1/windows_shell_install.ps1 `
            -PackagePath $package.FullName `
            -ResultDirectory artifacts/production-shell/installed `
            -Groups @($env:SHELL_GROUPS -split ',') `
            @filter
          exit $LASTEXITCODE
      - name: Upload installed shell evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-shell-ui-${{ matrix.shard }}
          path: |
            artifacts/production-shell/installed/*.json
            artifacts/production-shell/installed/*.png
            artifacts/production-shell/installed/*.log
          if-no-files-found: warn

  # dev-fast dispatch only: the same x64 build and shell smoke as the two jobs
  # above, without waiting for core-tests. Never runs on push or pull_request.
  dev-production-packages:
    if: ${{ inputs.dev-fast && !inputs.verify-test-gate }}
    runs-on: windows-2025
    strategy:
      matrix:
        architecture: [x64]
    steps: *production-packages-steps

  dev-production-shell-ui:
    name: dev-production-shell-ui (${{ matrix.shard }})
    needs: dev-production-packages
    runs-on: windows-2025
    strategy: *production-shell-ui-strategy
    steps: *production-shell-ui-steps

  reader-toolbar-ui:
    needs: core-tests
    if: ${{ !(inputs.dev-fast && !inputs.verify-test-gate) }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.401
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-toolbar-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-toolbar-
      - name: Restore locked toolbar test dependencies
        run: dotnet restore tools/p1/DesktopGuides.ReaderToolbarSmoke/DesktopGuides.ReaderToolbarSmoke.csproj --locked-mode -p:Platform=x64
      - name: Build unsigned toolbar test package
        shell: pwsh
        run: |
          dotnet build tools/p1/DesktopGuides.ReaderToolbarSmoke/DesktopGuides.ReaderToolbarSmoke.csproj `
            -c Release --no-restore -p:Platform=x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false
          exit $LASTEXITCODE
      - name: Sign, install, and test linked production toolbar
        shell: pwsh
        run: |
          $packages = @(
            Get-ChildItem tools/p1/DesktopGuides.ReaderToolbarSmoke/AppPackages `
              -Recurse -Filter 'DesktopGuides.ReaderToolbarSmoke_*_x64.msix'
          )
          if ($packages.Count -ne 1) {
            throw "Expected one x64 toolbar test package, found $($packages.Count)."
          }
          & pwsh -NoProfile -File ./tools/p1/test_windows_reader_toolbar_exclusive_install.ps1 `
            -PackagePath $packages[0].FullName `
            -ResultDirectory artifacts/reader-toolbar-ui/timeout
          if ($LASTEXITCODE -ne 0) {
            throw 'Overlapping toolbar install or timeout cleanup failed.'
          }
          & ./tools/p1/windows_reader_toolbar_install.ps1 `
            -PackagePath $packages[0].FullName `
            -ResultDirectory artifacts/reader-toolbar-ui `
            -SimulateSlowInstallSeconds 31
          $install = Get-Content artifacts/reader-toolbar-ui/signed-install.json `
            -Raw | ConvertFrom-Json
          if (-not $install.success -or
              -not $install.installReceiptVerified -or
              $install.simulatedSlowInstallSeconds -ne 31 -or
              $install.installReceiptElapsedSeconds -le 30) {
            throw 'Delayed toolbar install did not pass the receipt and timing checks.'
          }
      - name: Upload toolbar UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reader-toolbar-ui
          path: |
            artifacts/reader-toolbar-ui/*.json
            artifacts/reader-toolbar-ui/timeout/*.json
          if-no-files-found: warn

  native-arm64-core:
    needs: core-tests
    if: ${{ !(inputs.dev-fast && !inputs.verify-test-gate) }}
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Record native environment
        shell: pwsh
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          if ($architecture -ne 'Arm64') { throw "Expected native Arm64 process, got $architecture." }
          $os = Get-CimInstance Win32_OperatingSystem
          $runtimeVersions = @(
            Get-AppxPackage -Name 'Microsoft.WindowsAppRuntime.2*' |
              Where-Object { $_.Architecture -eq 'Arm64' } |
              ForEach-Object { $_.Version.ToString() }
          )
          New-Item -ItemType Directory -Force artifacts/native-arm64 | Out-Null
          [ordered]@{
            commit = $env:GITHUB_SHA
            runnerImage = "$env:ImageOS $env:ImageVersion"
            osBuild = [System.Environment]::OSVersion.Version.ToString()
            processArchitecture = $architecture
            cpuArchitecture = $env:PROCESSOR_ARCHITECTURE
            sessionId = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
            explorerProcesses = @(Get-Process explorer -ErrorAction SilentlyContinue).Count
            ramBytes = $os.TotalVisibleMemorySize * 1024
            dotnetSdk = (dotnet --version)
            windowsAppRuntime = $runtimeVersions
          } | ConvertTo-Json | Set-Content artifacts/native-arm64/environment.json -Encoding utf8
      - name: Verify fixtures
        shell: pwsh
        run: |
          python tools/p0/make_fixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/p0/verify_fixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- tests/fixtures/p0
          exit $LASTEXITCODE
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-headless-tests-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-headless-tests-
      - name: Restore locked headless test dependencies
        shell: pwsh
        run: |
          dotnet restore tests/DesktopGuides.Core.Tests/DesktopGuides.Core.Tests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/DesktopGuides.Infrastructure.Tests/DesktopGuides.Infrastructure.Tests.csproj --locked-mode
          exit $LASTEXITCODE
      - name: Run Core tests natively
        shell: pwsh
        run: |
          dotnet test tests/DesktopGuides.Core.Tests/DesktopGuides.Core.Tests.csproj `
            -c Release --no-restore `
            --logger "trx;LogFileName=native-arm64.trx" `
            --results-directory artifacts/native-arm64
          exit $LASTEXITCODE
      - name: Run Infrastructure tests natively
        shell: pwsh
        run: |
          dotnet test tests/DesktopGuides.Infrastructure.Tests/DesktopGuides.Infrastructure.Tests.csproj `
            -c Release --no-restore `
            --logger "trx;LogFileName=native-arm64-infrastructure.trx" `
            --results-directory artifacts/native-arm64
          exit $LASTEXITCODE
      - name: Upload native result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-arm64-core
          path: artifacts/native-arm64/*
          if-no-files-found: warn

  native-arm64-ui:
    needs: [packages, native-arm64-core]
    if: ${{ !(inputs.dev-fast && !inputs.verify-test-gate) }}
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-guides-ARM64
          path: artifacts/native-ui/download
      - name: Verify native desktop and package
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -ne 'Arm64') {
            throw 'The UI job must execute natively on ARM64.'
          }
          $session = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          $explorer = @(Get-Process explorer -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -eq $session })
          if ($explorer.Count -eq 0) { throw 'No interactive desktop in the runner session.' }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Signing test requires an elevated runner account.'
          }
          $package = Get-ChildItem artifacts/native-ui/download -Filter 'DesktopGuides.App_*_ARM64.msix' |
            Select-Object -First 1
          if (-not $package) { throw 'ARM64 app package is missing.' }
          $manifest = Get-Content artifacts/native-ui/download/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.architecture -ne 'ARM64' -or
              $manifest.package -ne $package.Name -or
              $manifest.packageSha256 -ne (Get-FileHash $package.FullName -Algorithm SHA256).Hash) {
            throw 'ARM64 package does not match its build manifest.'
          }
          Write-Output "Native session: $session; package: $($package.Name)"
      - name: Generate and verify fixtures
        shell: pwsh
        run: |
          python tools/p0/make_fixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/p0/verify_fixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- tests/fixtures/p0
          exit $LASTEXITCODE
      - name: Sign, install and run native UI suite
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/native-ui/download -Filter 'DesktopGuides.App_*_ARM64.msix' |
            Select-Object -First 1
          & ./tools/p0/windows_signed_install.ps1 `
            -PackagePath $package.FullName `
            -ResultDirectory artifacts/native-ui/installed
          exit $LASTEXITCODE
      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-arm64-ui
          path: |
            artifacts/native-ui/installed/signed-install.json
            artifacts/native-ui/installed/ui-suite/*.json
            artifacts/native-ui/installed/ui-suite/*.error.txt
          if-no-files-found: warn
